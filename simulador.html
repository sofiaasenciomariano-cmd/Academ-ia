<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador de admisión | ACADEM-IA</title>
<style>
body{margin:0;background:#f2f8fb;color:#18344f;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:35px auto;padding:20px}.top{background:#102b50;color:white;padding:25px;border-radius:18px}.box{background:white;padding:25px;border-radius:18px;margin-top:18px;box-shadow:0 5px 20px #102b5012}.muted{color:#61788b}.option{display:block;padding:12px;margin:9px 0;border:1px solid #c8dce6;border-radius:10px;cursor:pointer}.option:hover{background:#eaf4f7}.btn{background:#0f7185;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:8px 8px 0 0}.btn:disabled{opacity:.4;cursor:not-allowed}.bar{height:8px;background:#dceaf0;border-radius:10px;overflow:hidden}.fill{height:100%;background:#36b9b1;width:0}a{color:#bceff0}
</style></head><body><div class="wrap"><div class="top"><p>📘 ACADEM-IA</p><h1>Simulador de examen de admisión</h1><p>Practica preguntas de razonamiento matemático, verbal y cultura general.</p><p><a href="index.html">← Volver a ACADEM-IA</a></p></div><div class="box"><div class="bar"><div class="fill" id="progress"></div></div><p class="muted" id="counter">Pregunta 1 de 5</p><h2 id="question"></h2><div id="options"></div><p id="feedback" aria-live="polite"></p><button class="btn" id="next" disabled onclick="nextQ()">Siguiente</button><button class="btn" id="restart" style="display:none" onclick="restart()">Volver a intentar</button></div></div>
<script>
const qs=[
{q:"¿Cuánto es el 15 % de 200?",o:["15","20","30","35"],a:2,e:"15 % = 0.15; 200 × 0.15 = 30."},
{q:"¿Cuál es el sinónimo de ' efímero'?",o:["Eterno","Pasajero","Inmenso","Complejo"],a:1,e:"Efímero significa que dura poco tiempo: pasajero."},
{q:"Si 3x + 5 = 20, ¿cuánto vale x?",o:["3","5","7","8"],a:1,e:"Restamos 5: 3x = 15. Dividimos entre 3: x = 5."},
{q:"¿Qué palabra está correctamente escrita?",o:["Exepción","Excepción","Ecepción","Exsepción"],a:1,e:"La forma correcta es excepción."},
{q:"¿Cuál es el resultado de 2³ + 4?",o:["8","10","12","16"],a:2,e:"2³ = 8; 8 + 4 = 12."}
];
let i=0,score=0,done=false;
function render(){done=false;document.getElementById('counter').textContent=`Pregunta ${i+1} de ${qs.length}`;document.getElementById('progress').style.width=`${i/qs.length*100}%`;document.getElementById('question').textContent=qs[i].q;document.getElementById('feedback').textContent="";document.getElementById('next').disabled=true;document.getElementById('next').textContent=i===qs.length-1?"Ver resultado":"Siguiente";document.getElementById('options').innerHTML="";
qs[i].o.forEach((v,n)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+n)+") "+v;b.style.width="100%";b.style.textAlign="left";b.onclick=()=>choose(n);document.getElementById('options').appendChild(b);});}
function choose(n){if(done)return;done=true;let ok=n===qs[i].a;if(ok)score++;document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===qs[i].a)b.style.borderColor="#239b79";if(k===n&&!ok)b.style.borderColor="#d65b5b";});document.getElementById('feedback').textContent=(ok?"¡Correcto! ":"Respuesta incorrecta. ")+qs[i].e;document.getElementById('next').disabled=false;}
function nextQ(){if(i<qs.length-1){i++;render();}else{document.getElementById('progress').style.width="100%";document.getElementById('counter').textContent="Simulacro finalizado";document.getElementById('question').textContent=`Obtuviste ${score} de ${qs.length} respuestas correctas.`;document.getElementById('options').innerHTML="<p>"+(score>=4?"¡Excelente trabajo!":score>=3?"¡Buen avance! Sigue practicando.":"¡Sigue practicando! Cada intento te ayuda a mejorar.")+"</p>";document.getElementById('feedback').textContent="Este simulador es una práctica educativa referencial.";document.getElementById('next').style.display="none";document.getElementById('restart').style.display="inline-block";}}
function restart(){i=0;score=0;document.getElementById('next').style.display="inline-block";document.getElementById('restart').style.display="none";render()}render();
</script></body></html>
